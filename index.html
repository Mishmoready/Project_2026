<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="screen active" id="start-screen">
        <h1>Quiz Time</h1>
        <p>Test your knowledge with this fun questions!</p>
        <button id="start-btn">Start Quiz</button>
      </div>
      <div class="screen" id="question-screen">
        <div class="question-header">
          <h2 id="question-text">Question goes here</h2>
          <div class="question-information">
            <p>
              Question <span id="current-question">1</span> of <span>5</span>
            </p>
            <p>Score: <span id="score">0</span></p>
          </div>
          <div id="answers-container" class="answers-container">
            <!-- Answer buttons will be inserted here from our js code later at some point
             -->
          </div>
          <div class="progress-bar">
            <div id="progress" class="progress"></div>
            <div id="result-screen" class="screen">
              <h1>Question Result</h1>
              <div class="result-information">
                <p>
                  You scored <span id="final-score">0</span> out of
                  <span id="max-score">5</span>
                </p>
                <div id="result-message">Good job! Bitch</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
